# Every merge of dev -> main cuts a stable release: publishes to npm under the
# "latest" dist-tag via **Trusted Publishing (OIDC)** — no long-lived token —
# and creates a GitHub release. Default bump is MINOR; override on the PR with a
# label:
#   release:major  -> major bump
#   release:minor  -> minor bump (default)
#   release:patch  -> patch bump
#
# npm publish is gated on the repo variable NPM_PUBLISH == 'true'. Set it once
# you've created the npm package and configured a trusted publisher pointing at
# this workflow file (release.yml). Until then, the tag + GitHub release are
# still created and the npm step is skipped.
name: release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  id-token: write # OIDC for npm trusted publishing
  contents: write # push tags + create the GitHub release

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # all tags for version computation

      - uses: actions/setup-node@v4
        with:
          node-version: "24" # ships npm 11
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm i -g npm@latest

      - run: npm ci
      - run: npm run check # typecheck + test + build

      - name: Determine bump from PR labels (default minor)
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          bump=minor
          case ",$LABELS," in
            *,release:major,*) bump=major ;;
            *,release:patch,*) bump=patch ;;
            *,release:minor,*) bump=minor ;;
          esac
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "labels: $LABELS -> bump: $bump"

      - name: Compute next version
        id: ver
        run: |
          V=$(sh scripts/next-version.sh ${{ steps.bump.outputs.bump }})
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "next stable: $V"

      - name: Set package version
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Tag
        run: |
          git tag "${{ steps.ver.outputs.version }}"
          git push origin "${{ steps.ver.outputs.version }}"

      - name: Publish to npm (latest, OIDC — provenance auto-generated)
        if: vars.NPM_PUBLISH == 'true'
        run: npm publish --tag latest --access public

      - name: Note if npm publish is not enabled yet
        if: vars.NPM_PUBLISH != 'true'
        run: echo "::warning::NPM_PUBLISH variable not set — skipped npm publish. Create the package + trusted publisher, then set repo variable NPM_PUBLISH=true."

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: pi-pism-frame ${{ steps.ver.outputs.version }}
          prerelease: false
          generate_release_notes: true
