# Every merge into dev cuts a PATCH pre-release: builds, tags, and creates a
# GitHub *pre-release*. Pre-releases are NOT published to npm — they're
# installable straight from git:
#
#   pi install git:github.com/vandlol/pi-pism-frame@<tag>
#
# Only stable releases (dev -> main) go to npm (see release.yml). This keeps a
# single npm publish surface, which is required because a package can have only
# one npm trusted publisher (bound to release.yml).
name: release-dev

on:
  push:
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags for version computation

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run check # typecheck + test + build

      - name: Compute next patch version
        id: ver
        run: |
          V=$(sh scripts/next-version.sh patch)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "next pre-release: $V"

      - name: Tag
        run: |
          git tag "${{ steps.ver.outputs.version }}"
          git push origin "${{ steps.ver.outputs.version }}"

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: pi-pism-frame ${{ steps.ver.outputs.version }}
          prerelease: true
          generate_release_notes: true
